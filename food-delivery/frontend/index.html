<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Линуксоед — Рестораны</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e0c;
    --surface: #1a1814;
    --card: #211f1b;
    --accent: #e8c547;
    --accent2: #e87d47;
    --text: #f0ece3;
    --muted: #7a7568;
    --border: #2e2b24;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  header {
    padding: 2rem 3rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 900;
    color: var(--accent);
    letter-spacing: -0.5px;
  }

  .cart-btn {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 0.6rem 1.4rem;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .cart-btn:hover { background: var(--accent2); }

  .hero {
    padding: 5rem 3rem 3rem;
    max-width: 700px;
  }

  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.5rem, 5vw, 4rem);
    font-weight: 900;
    line-height: 1.1;
    margin-bottom: 1.5rem;
  }

  .hero h1 span { color: var(--accent); }

  .search-row {
    display: flex;
    gap: 0;
    max-width: 560px;
    flex-wrap: wrap;
  }

  .search-row select {
    flex: 1;
    min-width: 200px;
    padding: 1rem 1.2rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-right: none;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
    appearance: none;
    cursor: pointer;
  }
  .search-row select:focus { border-color: var(--accent); }
  .search-row select option { background: var(--card); color: var(--text); }


  .search-row button {
    padding: 1rem 1.8rem;
    background: var(--accent);
    color: var(--bg);
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .search-row button:hover { background: var(--accent2); }

  .section {
    padding: 2rem 3rem 4rem;
  }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    color: var(--muted);
    margin-bottom: 1.5rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-size: 0.8rem;
  }

  .restaurants-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1px;
    background: var(--border);
  }

  .restaurant-card {
    background: var(--card);
    padding: 2rem;
    cursor: pointer;
    transition: background 0.2s;
    position: relative;
    overflow: hidden;
  }
  .restaurant-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
    transform: scaleY(0);
    transition: transform 0.2s;
    transform-origin: bottom;
  }
  .restaurant-card:hover { background: #27241e; }
  .restaurant-card:hover::before { transform: scaleY(1); }

  .restaurant-card .cuisine {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--accent);
    margin-bottom: 0.5rem;
  }

  .restaurant-card h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 1.2rem;
    line-height: 1.2;
  }

  .restaurant-meta {
    display: flex;
    gap: 1.5rem;
    align-items: center;
  }

  .meta-item {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .meta-item .value {
    color: var(--text);
    font-weight: 500;
  }

  .rating-stars { color: var(--accent); }

  .menu-arrow {
    position: absolute;
    right: 1.5rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--border);
    font-size: 1.5rem;
    transition: color 0.2s, right 0.2s;
  }
  .restaurant-card:hover .menu-arrow {
    color: var(--accent);
    right: 1.2rem;
  }

  .loading {
    padding: 3rem;
    color: var(--muted);
    font-style: italic;
  }

  .error-msg {
    padding: 1rem 1.5rem;
    background: #2a1515;
    border-left: 3px solid #e84747;
    color: #e84747;
    margin-top: 1rem;
    max-width: 560px;
  }

  .empty {
    padding: 3rem 0;
    color: var(--muted);
  }
</style>
</head>
<body>

<header>
  <div class="logo">Линуксоед</div>
  <div style="display:flex;gap:0.8rem;align-items:center">
    <button style="background:none;border:1px solid var(--border);color:var(--muted);padding:0.5rem 1rem;font-family:'DM Sans',sans-serif;font-size:0.85rem;cursor:pointer;transition:all 0.2s" onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--muted)'" onclick="window.location='profile.html'">👤 Профиль</button>
    <button class="cart-btn" onclick="window.location='cart.html'">
      🛒 Корзина
    </button>
  </div>
</header>

<div class="hero">
  <h1>Еда у твоей<br><span>двери</span></h1>
  <div class="search-row">
    <select id="districtSelect" onchange="onDistrictChange()">
      <option value="">— Выбери район —</option>
      <option value="невский">Невский проспект</option>
      <option value="литейный">Литейный проспект</option>
      <option value="садовая">Садовая / Центр</option>
      <option value="адмиралтейск">Адмиралтейский</option>
      <option value="васильевск">Васильевский остров</option>
      <option value="петроград">Петроградская сторона</option>
      <option value="выборгск">Выборгская сторона</option>
      <option value="калинин">Калининский район</option>
      <option value="приморск">Приморский район</option>
      <option value="московск">Московский район</option>
      <option value="купчино">Купчино</option>
      <option value="фрунзенск">Фрунзенский район</option>
      <option value="кировск">Кировский район</option>
      <option value="красносельск">Красносельский район</option>
      <option value="красногвард">Красногвардейский район</option>
      <option value="пушкин">Пушкин</option>
      <option value="колпино">Колпино</option>
    </select>
    <button onclick="loadRestaurants()">Найти</button>
  </div>
  <div id="errorMsg"></div>
</div>

<div class="section" id="resultsSection" style="display:none">
  <div class="section-title" id="resultsLabel">Рестораны рядом</div>
  <div class="restaurants-grid" id="restaurantsList"></div>
</div>

<script>
  function onDistrictChange() {
    document.getElementById('errorMsg').innerHTML = '';
    loadRestaurants();
  }

  async function loadRestaurants() {
    const district = document.getElementById('districtSelect').value;
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.innerHTML = '';

    if (!district) {
      errorMsg.innerHTML = '<div class="error-msg">Выбери район доставки</div>';
      return;
    }

    const list = document.getElementById('restaurantsList');
    const section = document.getElementById('resultsSection');
    section.style.display = 'block';
    list.innerHTML = '<div class="loading">Ищем рестораны...</div>';

    try {
      const res = await fetch(`/restaurants?address=${encodeURIComponent(district)}`);
      if (!res.ok) throw new Error('Ошибка сервера');
      const data = await res.json();

      if (!data.restaurants || data.restaurants.length === 0) {
        list.innerHTML = `<div class="empty" style="padding:2rem 0">
          <div style="font-size:1.5rem;margin-bottom:0.8rem">😔</div>
          <div style="font-weight:500;margin-bottom:0.5rem">В этот район мы пока не доставляем</div>
          <div style="font-size:0.85rem">Выбери другой район из списка</div>
        </div>`;
        return;
      }

      document.getElementById('resultsLabel').textContent = `Рестораны рядом — ${data.restaurants.length}`;
      list.innerHTML = data.restaurants.map(r => `
        <div class="restaurant-card" onclick="goToMenu('${r.id}', '${r.name}')">
          <div class="cuisine">${r.cuisine}</div>
          <h2>${r.name}</h2>
          <div class="restaurant-meta">
            <div class="meta-item">
              <span class="rating-stars">★</span>
              <span class="value">${r.rating}</span>
            </div>
            <div class="meta-item">
              🕐 <span class="value">${r.deliveryTime} мин</span>
            </div>
          </div>
          <div class="menu-arrow">→</div>
        </div>
      `).join('');
    } catch (e) {
      list.innerHTML = '';
      errorMsg.innerHTML = `<div class="error-msg">Не удалось подключиться к серверу. Убедись что сервер запущен на localhost:8080</div>`;
    }
  }

  function goToMenu(id, name) {
    localStorage.setItem('restaurantId', id);
    localStorage.setItem('restaurantName', name);
    window.location.href = 'menu.html';
  }

  document.getElementById('districtSelect').addEventListener('keydown', e => {
    if (e.key === 'Enter') loadRestaurants();
  });
</script>
</body>
</html>
